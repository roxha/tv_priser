name: TV-priser daglig

on:
  workflow_dispatch:
  schedule:
    # 07:00 UTC = 08:00 norsk vintertid / 09:00 norsk sommertid.
    # GitHub kan starte planlagte jobber litt senere ved høy belastning.
    - cron: '0 7 * * *'

permissions:
  contents: write

concurrency:
  group: tv-priser-daglig
  cancel-in-progress: false

jobs:
  hent-priser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Hent repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Installer Python-pakker
        run: pip install -r requirements.txt
      - name: Installer Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Hent TV-priser
        env:
          TV_PRISER_DIR: ${{ github.workspace }}/data
          PYTHONUNBUFFERED: '1'
        run: python tv_priser.py
      - name: Lagre prishistorikk og rapport i GitHub
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/prisobservasjoner.csv data/TV_priser.xlsx data/innhenting.log 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Oppdater TV-priser $(date -u +%Y-%m-%d)"
            git push
          fi
      - name: Last opp rapport som kjøringsvedlegg
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TV-priser-rapport
          path: |
            data/TV_priser.xlsx
            data/prisobservasjoner.csv
            data/innhenting.log
          if-no-files-found: warn
          retention-days: 30
